<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A MISSION FAILED (NPC Masr) — NASA Space Apps</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/cutscene.css">
</head>
<body>
  <div id="game-shell">
    <!-- Global HUD Bar -->
    <header id="global-hud-bar">
      <div class="brand-section">
        <div class="brand-logo-badge" title="NASA Space Apps · NPC Masr">
          NPC
        </div>
        <div class="brand-title-group">
          <span class="brand-title">A MISSION FAILED</span>
          <span class="brand-subtitle">MAVEN 2 MARS INITIATIVE</span>
        </div>
      </div>

      <div class="hud-center-status">
        <div class="hud-stage-pill">
          <div id="hud-status-dot" class="hud-status-dot"></div>
          <span id="hud-stage-name">MAIN MENU</span>
        </div>
      </div>

      <div class="hud-controls-group">
        <button id="hud-btn-home" class="hud-btn" title="Return to Main Menu">
          <span>🏠</span> MENU
        </button>
        <button id="hud-btn-fullscreen" class="hud-btn" title="Toggle Fullscreen">
          <span>⛶</span> FULLSCREEN
        </button>
        <button id="hud-btn-dev" class="hud-btn" title="Toggle Developer Tools (Ctrl+~)">
          <span>⚙</span> DEV
        </button>
      </div>
    </header>

    <!-- Main Scene Viewport Container -->
    <main id="scene-container">
      <!-- Dynamically managed by SceneManager -->
    </main>
  </div>

  <!-- Universal Transition Overlay -->
  <div id="transition-overlay">
    <div class="transition-spinner"></div>
    <div id="transition-label" class="transition-label">ESTABLISHING TELEMETRY...</div>
  </div>

  <!-- Developer Console & Navigation Tray -->
  <div id="dev-tray">
    <div class="dev-tray-title">⚙ DEV JUMP PANEL</div>
    <div class="dev-scene-buttons">
      <button class="dev-scene-btn" data-scene="menu">MENU</button>
      <button class="dev-scene-btn" data-scene="stage1_intro">C1 INTRO</button>
      <button class="dev-scene-btn" data-scene="stage1_game">LVL 1 (WORKSHOP)</button>
      <button class="dev-scene-btn" data-scene="stage1_control">L1 (CONTROL)</button>
      <button class="dev-scene-btn" data-scene="stage2_intro">C2 INTRO</button>
      <button class="dev-scene-btn" data-scene="stage2_game">LVL 2 (CLEANROOM)</button>
      <button class="dev-scene-btn" data-scene="stage2_travel">TRANSIT</button>
      <button class="dev-scene-btn" data-scene="stage3_intro">C3 INTRO</button>
      <button class="dev-scene-btn" data-scene="stage3_game">LVL 3 (HABITAT)</button>
      <button class="dev-scene-btn" data-scene="results">RESULTS</button>
    </div>
    <div style="display: flex; gap: 4px;">
      <button class="dev-scene-btn dev-complete-btn" data-stage="1" style="color: var(--emerald);">COMPL L1</button>
      <button class="dev-scene-btn dev-complete-btn" data-stage="2" style="color: var(--emerald);">COMPL L2</button>
      <button class="dev-scene-btn dev-complete-btn" data-stage="3" style="color: var(--emerald);">COMPL L3</button>
    </div>
  </div>

  <!-- Core Architecture Scripts -->
  <script src="js/CutsceneEngine.js"></script>
  <script src="js/SceneManager.js"></script>
  <script src="js/Antigravity.js"></script>
</body>
</html>
