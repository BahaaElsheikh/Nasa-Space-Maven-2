<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="1; url=level3/mission.html">
  <title>Level 3 — Mission Order Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#070b24; --panel:#0b1233; --cyan:#19f0ff; --green:#39ff14; --orange:#ff9a1f; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
      font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:18px; color:#eaf4ff; text-align:center;
      background-color:var(--navy);
      background-image:
        radial-gradient(1.6px 1.6px at 24px 36px,#fff,transparent),
        radial-gradient(2.2px 2.2px at 130px 90px,#ffe9a8,transparent),
        radial-gradient(1.6px 1.6px at 210px 170px,#bff,transparent),
        radial-gradient(ellipse at 15% 0%,#16308f 0%,transparent 55%),
        radial-gradient(ellipse at 95% 100%,#064e6e 0%,transparent 50%);
      background-size:250px 210px,250px 210px,250px 210px,100% 100%,100% 100%;
    }
    .card {
      max-width:560px; width:100%; padding:32px 28px;
      background:linear-gradient(160deg,rgba(18,28,77,.97),rgba(8,13,42,.97));
      border:4px solid rgba(25,240,255,.55); border-radius:6px;
      box-shadow:0 0 0 3px #04071a, 7px 7px 0 3px #04071a, 0 0 22px rgba(25,240,255,.28);
    }
    h1 { font-family:'Pixelify Sans','Fredoka',sans-serif; font-weight:700; font-size:30px; margin:12px 0 8px;
         letter-spacing:.03em; text-shadow:3px 3px 0 #050818, 0 0 14px rgba(25,240,255,.55); }
    h1 span { color:var(--orange); }
    p { margin:6px 0; color:#b6c6f5; }
    .astro { width:96px; height:128px; image-rendering:pixelated; animation:bob 1s steps(2) infinite; }
    @keyframes bob { 50% { transform:translateY(-6px); } }
    .bar { margin:22px auto 6px; height:22px; border:3px solid rgba(25,240,255,.5); background:#050818; overflow:hidden; }
    .bar > div { height:100%; width:0; background:var(--green);
      background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(4,7,26,.55) 10px 12px);
      animation:load 3s linear forwards; }
    @keyframes load { to { width:100%; } }
    .go {
      display:inline-flex; align-items:center; gap:10px; margin-top:18px; padding:12px 26px; min-height:56px;
      font-family:'Pixelify Sans','Fredoka',sans-serif; font-weight:700; font-size:22px; color:#2a1100; text-decoration:none;
      background:linear-gradient(180deg,#ffc266,#ff9a1f); border:4px solid #ffe0b0; border-radius:4px;
      box-shadow:0 6px 0 #a64d00, 0 0 0 3px #04071a, 0 0 24px rgba(255,154,31,.55);
    }
    .go:hover { filter:brightness(1.08); }
    .go:active { transform:translateY(4px); box-shadow:0 2px 0 #a64d00, 0 0 0 3px #04071a; }
    .go:focus-visible { outline:4px solid var(--cyan); outline-offset:3px; }
    @media (prefers-reduced-motion:reduce) { .astro { animation:none; } .bar > div { animation-duration:.01s; } }
  </style>
</head>
