<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Mission Failed — Mars Rover Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== UNIFIED PIXEL-ART THEME MATCHING ROVER DESIGNER ===== */
:root {
  --ink: #eaf4ff;
  --teal: #19f0ff;
  --teal2: #0f1a4a;
  --sand: #9fb4ff;
  --paper: #0b1233;
  --line: #1a8aa6;
  --muted: #9fb4ff;
  --orange: #39ff14;
  --red: #ff4d7a;
  --green: #39ff14;
  --bg: #070b24;
  --panel: #0b1233;
  --panel2: #0f1a4a;
  --cream: #19f0ff;
  --mv: #19f0ff;
  --ob: #60a5fa;
  --en: #facc15;
  --sc: #c084fc;
  --bad: #ff4d7a;
  --ok: #39ff14;
  --warn: #ffe14a;
  --txt: #eaf4ff;
  --mut: #9fb4ff;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: #070b24;
  background-image: 
    radial-gradient(1.6px 1.6px at 24px 36px, #fff, transparent),
    radial-gradient(2px 2px at 130px 90px, #bff, transparent),
    radial-gradient(ellipse at 15% 0%, #16308f 0%, transparent 55%),
    radial-gradient(ellipse at 95% 100%, #064e6e 0%, transparent 50%);
  background-size: 250px 210px, 250px 210px, 100% 100%, 100% 100%;
  background-attachment: fixed;
  color: var(--txt);
  font: 15px/1.55 'Fredoka', Tahoma, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header h1, h2, h3, .card h2, #ctrls b, button.primary, .cathead h3 {
  font-family: 'Pixelify Sans', 'Fredoka', sans-serif;
  letter-spacing: .03em;
  color: #eaf4ff;
  text-shadow: 2px 2px 0 #04071a;
}
header {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 8px 16px;
  background: linear-gradient(180deg, #0e1747, #070b24);
  color: #eaf4ff;
  border-bottom: 4px solid #19f0ff;
  box-shadow: 0 4px 0 #04071a, 0 6px 22px rgba(25, 240, 255, .3);
  flex-wrap: wrap;
}
header h1 {
  font-size: clamp(16px, 2vw, 22px);
  margin: 0;
  color: #eaf4ff;
  text-shadow: 3px 3px 0 #04071a, 0 0 14px rgba(25, 240, 255, .6);
}
.maps { display: flex; gap: 8px; flex-wrap: wrap; }
.maps button { display: flex; gap: 6px; align-items: center; }
.badge { font-size: 11px; padding: 2px 6px; border-radius: 3px; color: #04071a; font-weight: bold; }
.easy { background: var(--ok); }
.med { background: var(--warn); }
.hard { background: var(--bad); }
.sp { flex: 1; }
#roverName {
  font-weight: bold;
  color: #19f0ff;
  padding: 4px 10px;
  background: #0b1233;
  border: 2px solid #1a8aa6;
  border-radius: 3px;
  text-shadow: 0 0 8px rgba(25,240,255,0.4);
}
button {
  font: inherit;
  font-family: 'Fredoka', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: #eaf4ff;
  background: #0f1a4a;
  border: 2px solid #1a8aa6;
  padding: 6px 12px;
  border-radius: 3px;
  box-shadow: 3px 3px 0 #04071a;
  transition: transform .1s, background .12s, border-color .12s, box-shadow .12s;
}
button:hover:not(:disabled) {
  border-color: #19f0ff;
  background: #1b2a6b;
  box-shadow: 3px 3px 0 #04071a, 0 0 14px rgba(25, 240, 255, .4);
}
button:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 1px 1px 0 #04071a;
}
button.on {
  background: #0f6e06;
  border-color: #39ff14;
  color: #eaffe5;
  box-shadow: 3px 3px 0 #04071a, 0 0 12px rgba(57, 255, 20, .45);
}
button.primary {
  background: #0f6e06;
  border-color: #39ff14;
  color: #eaffe5;
  box-shadow: 3px 3px 0 #04071a, 0 0 12px rgba(57, 255, 20, .45);
}
button:disabled {
  opacity: .45;
  cursor: not-allowed;
  box-shadow: none;
}

main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 320px;
  gap: 12px;
  padding: 12px;
}
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.panel {
  background: linear-gradient(160deg, #101b52, #080d2e);
  border: 3px solid rgba(25, 240, 255, .5);
  border-radius: 4px;
  box-shadow: 0 0 0 2px #04071a, 4px 4px 0 2px #04071a, 0 0 16px rgba(25, 240, 255, .18);
  padding: 12px;
  min-height: 0;
  overflow: auto;
}
.panel h2 {
  margin: 0 0 8px;
  font-size: 15px;
  color: #19f0ff;
  text-shadow: 2px 2px 0 #04071a;
  letter-spacing: .04em;
}
#palette { flex: 1; }
.cat { margin-bottom: 10px; }
.cat h3 { margin: 0 0 6px; font-size: 13px; color: var(--sand); }
.blk {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  margin-bottom: 6px;
  background: #080d2e;
  border: 2px solid #1a3a7a;
  border-left-width: 8px;
  border-radius: 3px;
  padding: 7px 10px;
  color: #eaf4ff;
  font-family: 'Fredoka', sans-serif;
  font-size: 13px;
}
.blk:hover:not(:disabled) {
  border-color: #19f0ff;
  box-shadow: 0 0 12px rgba(25, 240, 255, .35);
}
.blk[data-c=mv] { border-left-color: var(--mv); }
.blk[data-c=ob] { border-left-color: var(--ob); }
.blk[data-c=en] { border-left-color: var(--en); }
.blk[data-c=sc] { border-left-color: var(--sc); }
.blk:disabled { border-style: dashed; opacity: .45; }

#mapwrap {
  position: relative;
  flex: 1;
  min-height: 220px;
  border: 3px solid #19f0ff;
  border-radius: 4px;
  box-shadow: inset 0 0 0 2px #04071a, 0 0 18px rgba(25, 240, 255, .25);
  overflow: hidden;
  background: #000;
}
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: grab; }
.hud {
  position: absolute;
  pointer-events: none;
  background: rgba(8, 13, 46, 0.94);
  border: 2px solid #19f0ff;
  box-shadow: 0 0 14px rgba(25, 240, 255, .28);
  padding: 6px 12px;
  border-radius: 3px;
  max-width: 65%;
  font-family: 'Fredoka', sans-serif;
  font-size: 13px;
}
#hudObj { left: 10px; top: 10px; }
#hudCmd { right: 10px; top: 10px; min-width: 220px; }
#hudMsg { left: 10px; bottom: 10px; }
.bar { height: 10px; background: #050818; border: 1px solid #1a8aa6; margin-top: 4px; border-radius: 2px; }
.bar i { display: block; height: 100%; background: #39ff14; width: 0; box-shadow: 0 0 8px rgba(57,255,20,0.5); }

#ws { height: 260px; display: flex; flex-direction: column; }
#ctrls { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
#ctrls b { font-size: 14px; color: #19f0ff; margin-right: 4px; }
#list {
  flex: 1;
  overflow: auto;
  background: #050818;
  border: 2px dashed #1a8aa6;
  padding: 6px;
  border-radius: 3px;
}
#list.over { border-color: #39ff14; background: #061c28; }
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  background: #0b143c;
  border: 2px solid #1a5f9a;
  border-left-width: 8px;
  padding: 6px 10px;
  margin-bottom: 5px;
  border-radius: 3px;
  flex-wrap: wrap;
  color: #eaf4ff;
  font-size: 13px;
}
.row[data-c=mv] { border-left-color: var(--mv); }
.row[data-c=ob] { border-left-color: var(--ob); }
.row[data-c=en] { border-left-color: var(--en); }
.row[data-c=sc] { border-left-color: var(--sc); }
.row.cur { outline: 2px solid #39ff14; background: #06301a; box-shadow: 0 0 12px rgba(57, 255, 20, .45); }
.row.done { opacity: .55; }
.row.err { border-color: var(--bad); background: #3b1022; }
.row.inv { border-color: var(--warn); }
.row .n { color: var(--sand); width: 22px; font-weight: bold; }
.row .h { cursor: grab; color: var(--sand); }
.row input, .row select {
  width: 70px;
  background: #050818;
  color: #19f0ff;
  border: 2px solid #1a8aa6;
  border-radius: 3px;
  font: inherit;
  padding: 3px 6px;
}
.row select { width: auto; max-width: 160px; }
.row .st { margin-left: auto; font-size: 12px; color: var(--sand); }
.row .msg { flex-basis: 100%; color: var(--warn); font-size: 12px; }
.row button { padding: 2px 8px; font-size: 12px; }

.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--sand); }
.sec { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #1a8aa6; }
.warn { color: var(--warn); }
.crit { color: var(--bad); }
.ok { color: var(--ok); }
.eq { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 2px 0; }
.s-Active { color: var(--ok); font-weight: bold; }
.s-Standby { color: var(--sand); }
.s-Inactive { color: var(--mut); }
.s-Warning { color: var(--warn); }
.s-Unavailable { color: var(--bad); }
.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
#log { font-size: 12px; flex: 1; }
.le { border-bottom: 1px solid #1a3a7a; padding: 3px 0; }
.le.warning { color: var(--warn); }
.le.error { color: var(--bad); }
.le.sci { color: #d8b4fe; }
.le.ok { color: var(--ok); }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(4, 7, 26, 0.88);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 99;
  padding: 16px;
}
.modal.show { display: flex; }
.card {
  background: linear-gradient(160deg, #101b52, #080d2e);
  border: 3px solid #19f0ff;
  box-shadow: 0 0 24px rgba(25, 240, 255, .35), 0 0 0 2px #04071a;
  max-width: 640px;
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  padding: 20px;
  border-radius: 5px;
  color: #eaf4ff;
}
.card h2 { margin: 0 0 10px; font-size: 22px; color: #19f0ff; }
.card.bad h2 { color: var(--bad); }
.card.good h2 { color: var(--ok); }
.card .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.card textarea {
  width: 100%;
  height: 96px;
  background: #050818;
  color: #eaf4ff;
  border: 2px solid #1a8aa6;
  border-radius: 3px;
  font: inherit;
  padding: 8px;
}
.tip {
  position: absolute;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  background: #0b143c;
  color: #eaf4ff;
  border: 3px solid #19f0ff;
  box-shadow: 0 0 16px rgba(25, 240, 255, .3);
  padding: 10px 16px;
  max-width: 75%;
  z-index: 10;
  border-radius: 4px;
  display: none;
}
.tip button { margin-left: 10px; }
small, .mut { color: var(--sand); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #050818; }
::-webkit-scrollbar-thumb { background: #19f0ff; border-radius: 2px; }

@media(max-width: 1024px) {
  main { grid-template-columns: 210px 1fr 270px; }
}
@media(max-width: 820px) {
  main { grid-template-columns: 1fr; overflow-y: auto; }
  #mapwrap { min-height: 320px; }
}
</style></head><body>
<header><h1>▲ A MISSION FAILED — MARS ROVER CONTROL</h1>
<div class="maps" id="maps"></div><span class="sp"></span>
<span id="roverName">No rover</span>
<button id="bImport">Import rover</button><button id="bTraj" class="on">Trajectory: ON</button><button id="bFollow" class="on">Follow</button><button id="bFit">Fit map</button><button id="bHelp">? Tips</button></header>
<main>
<div class="col"><div class="panel" id="palette"><h2>Command labels</h2><div id="pal"></div></div></div>
<div class="col">
 <div id="mapwrap"><canvas id="cv"></canvas>
  <div class="hud" id="hudObj"></div><div class="hud" id="hudCmd"></div><div class="hud" id="hudMsg" style="display:none"></div>
  <div class="tip" id="tip"></div></div>
 <div class="panel" id="ws"><div id="ctrls">
  <b>PROGRAM</b><button id="bRun">▶ RUN</button><button id="bAuto" style="background:#24495c;border-color:#00F0FF;color:#00F0FF;font-weight:bold" title="Auto-plan path to science targets and landing pad">⚡ AUTOPILOT</button><button id="bPause">❚❚ PAUSE</button><button id="bResume">▶ RESUME</button><button id="bStep">⏭ STEP</button><button id="bReset">↺ RESET</button><button id="bClear">✕ CLEAR</button><span id="prog" class="mut"></span></div>
  <div id="list"></div></div>
</div>
<div class="col"><div class="panel" id="side" style="flex:1;display:flex;flex-direction:column">
 <div class="tabs"><button id="tT" class="on">Rover condition</button><button id="tL">Mission log</button></div>
 <div id="cond" style="flex:1;overflow:auto"></div><div id="log" style="display:none;overflow:auto"></div></div></div>
</main>
<div class="modal" id="modal"><div class="card" id="card"></div></div>
<script src="scripts/catalog.js"></script>
<script src="scripts/main.js"></script>
</body></html>
